<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>GemBull</title>
<style>
:root{--bg:#121316;--pn:#1c1d22;--pn2:#262830;--ln:#31343e;--tx:#eceaea;--mu:#989da6;--ac:#e82e3b;--tl:#e72330;--rd:#ef5b5b}
*{box-sizing:border-box;margin:0}
body{background:radial-gradient(1100px 560px at 85% -10%,#32343f 0,transparent 60%),var(--bg);color:var(--tx);font:15px/1.4 Bahnschrift,"Segoe UI",system-ui,sans-serif;min-height:100vh}
header{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:10px;padding:10px 20px;background:#121316ee;backdrop-filter:blur(8px);border-bottom:1px solid var(--ln);flex-wrap:wrap}
.logo{font-size:20px;cursor:pointer;margin-right:8px;letter-spacing:.5px}.logo b{color:var(--ac)}
nav{display:flex;gap:4px;flex-wrap:wrap;flex:1}
nav button{background:none;border:0;color:var(--mu);padding:8px 12px;border-radius:8px;font:inherit;cursor:pointer}
nav button:hover{color:var(--tx);background:var(--pn)}nav button.on{color:var(--bg);background:var(--ac)}
.bal{background:var(--pn);border:1px solid var(--ln);padding:7px 14px;border-radius:20px;color:var(--ac);font-weight:700}
.av{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-weight:700;cursor:pointer}
main{max-width:1200px;margin:0 auto;padding:22px 16px 60px}
h1{font-size:clamp(28px,5vw,48px);line-height:1.1;margin-bottom:10px}h2{margin:26px 0 12px;font-size:22px}
.mu{color:var(--mu)}.row{display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.btn{background:var(--ac);color:#140608;border:0;padding:11px 20px;border-radius:9px;font:inherit;font-weight:700;cursor:pointer}
.btn:hover{filter:brightness(1.1)}.btn.alt{background:var(--pn2);color:var(--tx);border:1px solid var(--ln)}.btn.sm{padding:6px 10px;font-size:13px}.btn.red{background:var(--rd);color:#fff}
.btn:disabled{opacity:.4;cursor:not-allowed}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px}
.cg{grid-template-columns:repeat(auto-fill,minmax(200px,1fr))}
.sk{--c:#888;background:linear-gradient(180deg,var(--pn),color-mix(in srgb,var(--c) 24%,var(--pn)));border:1px solid var(--ln);border-bottom:3px solid var(--c);border-radius:10px;padding:10px;text-align:center;display:flex;flex-direction:column;gap:3px}
.sk img{width:100%;height:80px;object-fit:contain}.sk .nm{font-weight:600;font-size:14px}.sk small{color:var(--mu)}.sk b{color:var(--ac)}.sk.pick{cursor:pointer}.sk.pick:hover,.sk.sel{outline:2px solid var(--tl)}
.cc{background:var(--pn);border:1px solid var(--ln);border-radius:12px;overflow:hidden;cursor:pointer;display:flex;flex-direction:column;transition:transform .15s}.cc:hover{transform:translateY(-3px);border-color:var(--ac)}
.cc img{width:100%;aspect-ratio:10/7;object-fit:cover}.cc b,.cc span,.cc i{padding:3px 12px}.cc i{font-style:normal;color:var(--ac);font-weight:700;padding-bottom:10px}
.hero{padding:34px 0 18px}.hero p{margin-bottom:18px;max-width:560px}
.mq{overflow:hidden;margin:10px 0}.mq .tr{display:flex;gap:10px;width:max-content;animation:mq 50s linear infinite}.mq .sk{width:160px}
@keyframes mq{to{transform:translateX(-50%)}}
.cv{width:260px;border-radius:12px}.big{font-size:28px;color:var(--ac);font-weight:700;margin:8px 0 14px}
.reelw{position:relative;overflow:hidden;margin:20px 0;background:var(--pn);border:1px solid var(--ln);border-radius:12px;padding:14px 0}
.reelw .pt{position:absolute;left:50%;top:0;bottom:0;width:3px;background:var(--ac);z-index:3;box-shadow:0 0 12px var(--ac)}
.reel{display:flex;will-change:transform}.cell{flex:0 0 140px;margin-right:8px}.cell img{height:64px}.cell small{font-size:11px}
.up{display:grid;grid-template-columns:1fr auto 1fr;gap:18px;align-items:center}
.slot{min-height:190px;background:var(--pn);border:1px dashed var(--ln);border-radius:12px;padding:12px;display:grid;place-items:center;text-align:center}
.wheel{--d:0deg;position:relative;width:250px;height:250px;border-radius:50%;background:conic-gradient(var(--tl) 0 var(--d),#343742 0);display:grid;place-items:center;margin:auto}
.wheel::after{content:'';position:absolute;inset:22px;border-radius:50%;background:var(--pn)}.wheel span{position:relative;z-index:2;font-size:34px;font-weight:700}
.ptr{position:absolute;inset:0;transition:transform 5s cubic-bezier(.1,.7,.1,1);z-index:3}.ptr::before{content:'';position:absolute;left:50%;top:-6px;width:4px;height:44px;margin-left:-2px;background:var(--ac);border-radius:2px;box-shadow:0 0 8px var(--ac)}
.tabs{display:flex;gap:6px;justify-content:center;margin:14px 0;flex-wrap:wrap}.tabs button{background:var(--pn2);border:1px solid var(--ln);color:var(--tx);padding:8px 14px;border-radius:8px;font:inherit;cursor:pointer}.tabs button.on{background:var(--tl);color:#101113;border-color:var(--tl)}
input,select{background:var(--pn2);border:1px solid var(--ln);color:var(--tx);padding:9px 11px;border-radius:8px;font:inherit;max-width:100%}
.bar{display:flex;gap:10px;flex-wrap:wrap;margin:10px 0 16px;align-items:center}
.pn{background:var(--pn);border:1px solid var(--ln);border-radius:12px;padding:16px;margin:10px 0}
table{width:100%;border-collapse:collapse;font-size:14px}th,td{padding:7px 8px;border-bottom:1px solid var(--ln);text-align:left}td input{width:110px}
.ov{position:fixed;inset:0;background:#000b;display:grid;place-items:center;z-index:50;padding:16px}.ov .pn{max-width:380px;text-align:center}
#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--pn2);border:1px solid var(--ac);padding:10px 18px;border-radius:10px;z-index:60;display:none}
footer{text-align:center;color:var(--mu);font-size:12px;padding:20px}footer a{cursor:pointer;text-decoration:underline}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--tl)}
@media(max-width:760px){.up{grid-template-columns:1fr}.cv{width:100%}header{padding:8px 10px}nav{order:5;flex:0 0 100%;flex-wrap:nowrap;overflow-x:auto;-webkit-overflow-scrolling:touch}nav button{white-space:nowrap;flex:0 0 auto}.bal{margin-left:auto}}
@media(prefers-reduced-motion:reduce){.mq .tr{animation:none}.cc{transition:none}}
.bt{display:grid;grid-template-columns:1fr 150px 1fr;gap:14px;align-items:start}.mid{text-align:center;padding-top:30px}.bot{background:var(--pn);border:1px solid var(--ln);border-radius:12px;padding:10px;text-align:center;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:6px}.bot.sel{border-color:var(--tl);outline:2px solid var(--tl)}.bot img{width:56px;height:56px}
.chs{display:flex;border-radius:8px;overflow:hidden;font-weight:700;margin:10px 0}.chs span{padding:8px;text-align:center}.chs span:first-child{background:var(--tl);color:#101113}.chs span:last-child{background:var(--rd);color:#fff}
@media(max-width:760px){.bt{grid-template-columns:1fr}.mid{padding-top:0}}.coin{width:min(68vw,250px);aspect-ratio:1;border-radius:50%;border:8px solid #b6202d;background:radial-gradient(circle at 35% 30%,#efe6e6,#e82e3b 45%,#b6202d);box-shadow:0 0 50px #e82e3b66,inset 0 -10px 24px #7b161e88;color:#7b161e;font-size:90px;cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent;user-select:none;transition:transform .07s}.coin:active{transform:scale(.92)}.coin:focus-visible{outline:3px solid var(--tl);outline-offset:6px}
.fl{position:absolute;color:var(--ac);font-weight:700;font-size:22px;pointer-events:none;animation:fl .9s ease-out forwards;text-shadow:0 2px 6px #000}@keyframes fl{to{transform:translateY(-80px);opacity:0}}.pb{height:10px;background:var(--pn2);border-radius:6px;overflow:hidden}.pb i{display:block;height:100%;background:linear-gradient(90deg,var(--tl),var(--ac));transition:width .4s}.st{font-size:12px;padding:2px 8px;border-radius:10px;background:var(--pn2);align-self:flex-start}.st.ok{background:var(--tl);color:#101113}.st.got{background:var(--ln);color:var(--mu)}
@media(prefers-reduced-motion:reduce){.fl{animation-duration:.01s}.pb i{transition:none}}
.msl{width:100%;display:flex;flex-direction:column;gap:8px;text-align:left}.msl .hd{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;font-weight:700}.msl .hd b{color:var(--ac)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.sk.lk{opacity:.45;pointer-events:none}.cnt{display:inline-block;background:var(--tl);color:#101113;border-radius:10px;padding:0 8px;font-weight:700}
.calc{font-size:13px;color:var(--mu);text-align:center;margin:8px 0}.calc b{color:var(--tx)}
.sk{position:relative;overflow:hidden;animation:skin .35s ease both}
.mq .sk,.cell.sk{animation:none}
@keyframes skin{from{opacity:0;transform:translateY(6px) scale(.97)}}
.sk.r5{box-shadow:0 0 14px -5px var(--c)}
.sk.r6{box-shadow:0 0 18px -4px var(--c),inset 0 0 18px -12px var(--c)}
.sk.gold{border-color:#e82e3b;border-bottom-color:#e93d49;background:linear-gradient(180deg,#2a1013,color-mix(in srgb,#e82e3b 26%,var(--pn)));box-shadow:0 0 22px -2px #e82e3b99,inset 0 0 24px -10px #e82e3b}
.sk.gold::after{content:'';position:absolute;inset:0;background:linear-gradient(115deg,transparent 35%,#efe6e655 50%,transparent 65%);transform:translateX(-120%);animation:shim 3.4s ease-in-out infinite;pointer-events:none}
@keyframes shim{60%,100%{transform:translateX(120%)}}
.sk.gold .nm{color:#efe6e6}
.sk.out{animation:skout .26s ease both}@keyframes skout{to{opacity:0;transform:scale(.8) translateY(-10px)}}
.sk.rv,.rv{animation:rv 1.1s ease}@keyframes rv{0%{transform:scale(.6);opacity:0}55%{transform:scale(1.08)}100%{transform:scale(1);opacity:1}}
.fxl{position:fixed;z-index:70;pointer-events:none;width:0;height:0}
.fxl i{position:absolute;left:0;top:0;width:var(--s);height:var(--s);border-radius:50%;opacity:0;animation:fxp 900ms ease-out forwards;box-shadow:0 0 8px currentColor}
@keyframes fxp{0%{opacity:1;transform:translate(0,0)}100%{opacity:0;transform:translate(var(--x),var(--y))}}
.fxf{position:fixed;z-index:71;pointer-events:none;font-weight:700;font-size:20px;color:var(--ac);text-shadow:0 2px 8px #000;animation:fxf 1.1s ease-out forwards}
@keyframes fxf{0%{transform:translate(-50%,0);opacity:1}100%{transform:translate(-50%,-70px);opacity:0}}
.flash{position:fixed;inset:0;z-index:65;pointer-events:none;animation:fls .9s ease-out forwards}
@keyframes fls{0%{opacity:0}15%{opacity:.6}100%{opacity:0}}
.sab{position:fixed;top:90px;left:50%;transform:translateX(-50%);z-index:72;pointer-events:none;text-align:center;background:var(--pn2);border:2px solid var(--ac);border-radius:16px;padding:14px 28px;box-shadow:0 0 40px #e82e3b66;animation:sab 2.6s ease both}
.sab b{display:block;font-size:34px;color:var(--ac)}.sab span{color:var(--mu)}
@keyframes sab{0%{opacity:0;transform:translate(-50%,-20px) scale(.9)}12%{opacity:1;transform:translate(-50%,0) scale(1)}85%{opacity:1}100%{opacity:0;transform:translate(-50%,-10px)}}
.balup{animation:balup .7s}@keyframes balup{40%{transform:scale(1.12);color:#7dffb0;box-shadow:0 0 16px #e7233088}}
.baldn{animation:baldn .6s}@keyframes baldn{40%{color:#ff8a8a;transform:scale(.95)}}
.shake{animation:shk .5s}@keyframes shk{20%{transform:translateX(-8px)}40%{transform:translateX(8px)}60%{transform:translateX(-5px)}80%{transform:translateX(4px)}}
.pn.win{box-shadow:0 0 44px #e82e3b88;border-color:var(--ac)}.pn.lose{border-color:var(--rd);box-shadow:0 0 30px #ef5b5b55}
.hl{color:#fff!important;text-shadow:0 0 16px var(--ac);animation:hl 1s ease infinite alternate}@keyframes hl{to{transform:scale(1.08)}}
.cf{position:absolute;color:var(--ac);font-weight:700;pointer-events:none;animation:cf .7s ease-out forwards}
@keyframes cf{to{transform:translate(var(--x),var(--y)) rotate(var(--r));opacity:0}}
.coin.hit{animation:coinhit .12s}@keyframes coinhit{50%{transform:scale(.94)}}
.rng{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:10px 0}.rng label{min-width:150px}.rng input[type=range]{flex:1;min-width:140px;padding:0;accent-color:var(--ac)}.rng .v{min-width:44px;text-align:right}
@media(prefers-reduced-motion:reduce){.sk,.rv,.sk.rv,.hl,.shake,.sab{animation-duration:.01s}.sk.gold::after{animation:none}}

.bigch{font-size:58px;font-weight:800;text-align:center;line-height:1;transition:color .15s}.chl{text-align:center;color:var(--mu);margin-bottom:4px}
.chs{display:flex;flex-direction:column;gap:10px;margin:14px 0}.chs .row{justify-content:center;gap:10px;flex-wrap:wrap}.chs input[type=number]{width:110px}
.chs input[type=range]{-webkit-appearance:none;appearance:none;height:10px;border-radius:6px;background:linear-gradient(90deg,hsl(0,80%,55%),hsl(60,80%,55%),hsl(120,80%,55%));padding:0;border:0;width:100%}
.chs input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:26px;height:26px;border-radius:50%;background:#fff;border:4px solid var(--ac);cursor:pointer}
.chs input[type=range]::-moz-range-thumb{width:20px;height:20px;border-radius:50%;background:#fff;border:4px solid var(--ac);cursor:pointer}
.calc div{margin:4px 0}.warn{color:#ff9b9b}.okk{color:#7dffb0}.info{color:var(--ac)}.calc .btn.sm{margin-left:6px}
.pct{color:var(--mu);font-size:12px}
.pb.lim{height:14px;margin:8px 0}.pb.lim i{background:linear-gradient(90deg,var(--tl),var(--ac),#ef5b5b)}.coin.capped{filter:grayscale(.8);opacity:.6}
/* ===== v6: мульти-кейсы, апгрейд, Skin Mines ===== */
.cq{background:var(--pn);border:1px solid var(--ln);border-radius:12px;padding:14px;margin:12px 0;max-width:560px}
.cq .tabs{justify-content:flex-start;margin:8px 0}
.cq .sum{display:grid;grid-template-columns:1fr auto;gap:4px 16px;font-size:14px;margin-top:8px}.cq .sum b{color:var(--ac);text-align:right}
.cq .sum .tot{font-size:18px;color:var(--tx)}.cq .sum b.tot{color:var(--ac)}
#cqW{margin-top:6px;font-size:13px}
.mgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin:16px 0}
.mt{--c:#55596c;height:176px;overflow:hidden;position:relative;border:1px solid var(--ln);border-bottom:3px solid var(--c);border-radius:10px;background:var(--pn);transition:box-shadow .3s,border-color .3s}
.mt .ms{display:flex;flex-direction:column;will-change:transform}
.mt .mi{flex:0 0 176px;height:176px;border:0;border-radius:0;justify-content:center;animation:none!important;padding:8px 8px 10px;gap:2px}
.mt .mi img{height:72px}.mt .mi .nm{font-size:12px;line-height:1.2;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.mt .mi small{font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mt.done{border-color:var(--c);box-shadow:0 0 18px -3px var(--c)}
.csum{max-width:680px;margin:14px auto;text-align:center}
.csum .hd{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;font-weight:700;margin-bottom:6px}
.csum .st2{display:flex;justify-content:center;gap:6px 18px;flex-wrap:wrap;color:var(--mu);font-size:14px;margin:6px 0 10px}.csum .st2 b{color:var(--ac)}
.csum .one{max-width:220px;margin:8px auto}
.sk.sel{outline:3px solid var(--tl);box-shadow:0 0 18px -2px var(--tl);transform:translateY(-2px)}
.sk.sel::before{content:'✓';position:absolute;top:6px;right:8px;background:var(--tl);color:#101113;border-radius:50%;width:22px;height:22px;display:grid;place-items:center;font-weight:800;z-index:2}
.upbar{position:fixed;left:50%;bottom:12px;transform:translateX(-50%);z-index:18;background:#1c1d22ee;border:1px solid var(--tl);border-radius:14px;padding:8px 16px;box-shadow:0 8px 30px #000a;max-width:calc(100vw - 24px);font-size:14px;display:flex;gap:4px 14px;flex-wrap:wrap;justify-content:center;backdrop-filter:blur(6px)}
.upbar:empty{display:none}.upbar b{color:var(--ac)}
.mtitle{font-size:clamp(28px,5vw,44px);letter-spacing:2px;background:linear-gradient(90deg,#e72330,#e72330,#ff3b5c);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 14px #e7233066)}
.mines{display:grid;grid-template-columns:minmax(0,540px) minmax(280px,1fr);gap:20px;align-items:start;margin-top:14px}
@media(max-width:860px){.mines{grid-template-columns:1fr}}
.mwrap{background:radial-gradient(600px 300px at 50% 0,#2e313b66,transparent 70%),#0d0e10;border:1px solid #2f323c;border-radius:16px;padding:14px;box-shadow:0 0 40px -12px #e7233066,inset 0 0 40px -20px #e7233055}
.mboard{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}
.mc{aspect-ratio:1;border-radius:12px;border:1px solid #3c3f4c;background:linear-gradient(145deg,#22242b,#151519);color:#e72330;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font:inherit;font-weight:700;font-size:clamp(9px,2.1vw,14px);position:relative;overflow:hidden;padding:0;transition:transform .12s,border-color .15s,box-shadow .15s}
.mc svg{width:44%;height:44%}
.mc:not(:disabled):hover{transform:translateY(-2px) scale(1.04);border-color:#e72330;box-shadow:0 0 18px -2px #e72330aa,inset 0 0 16px -6px #e72330}
.mc:disabled{cursor:default}
.mc.safe{border-color:#35ffb0;background:radial-gradient(circle at 50% 35%,#13694f,#07231c);color:#b8ffe6;box-shadow:0 0 16px -4px #35ffb0aa,inset 0 0 16px -8px #35ffb0}
.mc.safe.fresh{animation:mflip .5s ease}
@keyframes mflip{0%{transform:rotateY(90deg) scale(.7);opacity:.2}60%{transform:rotateY(-12deg) scale(1.12)}100%{transform:none;opacity:1}}
.mc.trap{border-color:#ff3b5c;background:radial-gradient(circle at 50% 40%,#3b3e4a,#15161a);color:#ffb3c1;box-shadow:0 0 20px -4px #ff3b5c}
.mc.trap.hit{animation:mboom .7s ease;box-shadow:0 0 34px 2px #ff3b5ccc;border-color:#fff}
@keyframes mboom{0%{transform:scale(.6)}30%{transform:scale(1.28) rotate(-6deg);filter:brightness(2)}100%{transform:none}}
.mc.show,.mc.dim{animation:mrev .4s ease both;animation-delay:var(--dl,0ms)}
@keyframes mrev{from{opacity:0;transform:scale(.8)}}
.mc.dim{opacity:.4;filter:saturate(.5)}
.mp{background:linear-gradient(180deg,#15161a,#111114);border:1px solid #3c3f4c;border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:10px;box-shadow:0 0 30px -14px #e72330}
.mpts{display:flex;justify-content:space-between;align-items:center;font-weight:700;gap:8px;flex-wrap:wrap}.mpts b{color:#e72330;text-shadow:0 0 10px #e7233088}
.mchips{display:flex;gap:6px;flex-wrap:wrap}
.mdiff{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.mdiff button{background:#1c1d22;border:1px solid #3c3f4c;color:var(--tx);border-radius:10px;padding:8px;font:inherit;cursor:pointer;display:flex;flex-direction:column;align-items:center}
.mdiff button small{color:var(--mu)}.mdiff button.on{border-color:#e72330;box-shadow:0 0 14px -3px #e72330;background:#292b34}
.mst{display:grid;grid-template-columns:1fr 1fr;gap:6px}.mst div{background:#15161a;border:1px solid #2f323c;border-radius:10px;padding:6px 10px;font-size:13px;color:var(--mu)}
.mst b{display:block;color:var(--tx);font-size:16px}.mst .pot b{color:#35ffb0}
.mcash{background:linear-gradient(90deg,#e72330,#35ffb0);color:#101113}.mstart{background:linear-gradient(90deg,#e72330,#e72330);color:#fff}
.mres{border-radius:12px;padding:12px;text-align:center;font-weight:700}
.mres.win{background:#0f3a2c;border:1px solid #35ffb0;color:#b8ffe6;box-shadow:0 0 24px -6px #35ffb0}
.mres.lose{background:#1f2126;border:1px solid #ff3b5c;color:#ffc2cd;box-shadow:0 0 24px -6px #ff3b5c}
.mres small{display:block;font-weight:400;opacity:.85;margin-top:2px}
.mgood{color:#7dffb0}.mbad{color:#ff8a8a}
@media(prefers-reduced-motion:reduce){.mc.safe.fresh,.mc.trap.hit,.mc.show,.mc.dim{animation-duration:.01s}}
#mhist .pn{overflow-x:auto}#mhist td,#mhist th{white-space:nowrap}
.mex{border-top:1px solid #3c3f4c;padding-top:10px;display:flex;flex-direction:column;gap:8px}
@keyframes scj{to{box-shadow:0 0 46px 2px #e93d49ee,inset 0 0 30px -8px #e82e3b}}
.mt.l2.done{box-shadow:0 0 26px -2px var(--c)}
.mt.l3.done{border-color:#e93d49;animation:scj 1.6s ease-in-out infinite alternate}

function sync(p){const o=c(p);p.inv.forEach(i=>{const n=parseInt(String(i.iid).slice(1))||0;if(n>o.mx){o.mx=n;o.items++;o.own[i.sid]=1;const k=SK[IX[i.sid]];if(k&&k.price>o.bestSkin)o.bestSkin=k.price}})}

function norm(w){const s=w.reduce((a,b)=>a+b,0),q=w.map(x=>Math.max(1,Math.round(x/s*10000)));let m=0;q.forEach((v,i)=>{if(v>q[m])m=i});q[m]+=10000-q.reduce((a,b)=>a+b,0);return q.map(v=>v/100)}
function calc(it,P){const pr=it.map(x=>SK[IX[x.sid]].price);let lo=0,hi=6,w;
for(let k=0;k<30;k++){const e=(lo+hi)/2;w=pr.map(p=>Math.pow(p/P,-e));const s=w.reduce((a,b)=>a+b),ev=w.reduce((a,x,i)=>a+x*pr[i],0)/s;if(ev>.88*P)lo=e;else hi=e}
const q=norm(w);it.forEach((x,i)=>x.p=q[i]);return it}
function mkItemsOld(P,r,cf){cf=cf||(S&&S.cfg)||CFG0;const lo=P*cf.dropMin,hi=P*cf.dropMax,mid=Math.sqrt(lo*hi);
let c=SK.filter(s=>s.price>=lo&&s.price<=hi).sort((a,b)=>a.price-b.price);
if(c.length<6)c=[...SK].sort((a,b)=>Math.abs(Math.log(a.price/mid))-Math.abs(Math.log(b.price/mid))).slice(0,6).sort((a,b)=>a.price-b.price);
let pk=c;if(c.length>12){pk=[];for(let i=0;i<12;i++)pk.push(c[Math.round(i*(c.length-1)/11)])}
let a=0,b=30,w;for(let k=0;k<40;k++){const e=(a+b)/2;w=pk.map(s=>Math.pow(s.price/mid,-e));const sw=w.reduce((x,y)=>x+y,0),ev=w.reduce((x,y,i)=>x+y*pk[i].price,0)/sw;if(ev>(cf.ev||.9)*P)a=e;else b=e}

 const T=CASE_TIERS.map(([pc,lo,hi,n])=>{const c=SK.filter(s=>s.price*100>=P*lo&&s.price*100<=P*hi).sort((a,b)=>a.price-b.price);let pk=c;if(c.length>n){pk=[];for(let i=0;i<n;i++)pk.push(c[Math.round(i*(c.length-1)/(n-1))])}return{u:pc*100,pk}});
 for(let i=0;i<T.length;i++)if(!T[i].pk.length){const o=T.map((t,j)=>j).filter(j=>T[j].pk.length).sort((a,b)=>Math.abs(a-i)-Math.abs(b-i))[0];if(o===undefined)return mkItemsOld(P,r,cf);T[o].u+=T[i].u;T[i].u=0}
 const sh=e=>T.map(t=>{if(!t.u)return[];const w=t.pk.map(s=>Math.pow(s.price/t.pk[0].price,-e)),sw=w.reduce((x,y)=>x+y,0);return w.map(x=>x/sw)});
 const evf=e=>{const S2=sh(e);return T.reduce((a,t,i)=>a+(t.u/10000)*t.pk.reduce((x,s,k)=>x+(S2[i][k]||0)*s.price,0),0)};
 let a=0,b=40;if(evf(0)>tg){for(let k=0;k<50;k++){const e=(a+b)/2;if(evf(e)>tg)a=e;else b=e}}else b=0;
 const SH=sh((a+b)/2),out=[];
 T.forEach((t,i)=>{if(!t.u)return;const n=t.pk.length,un=SH[i].map(s=>Math.max(1,Math.floor(t.u*s)));let d=t.u-un.reduce((x,y)=>x+y,0);const ord=SH[i].map((s,k)=>k).sort((x,y)=>SH[i][y]-SH[i][x]);
  for(let k=0;d>0;k++,d--)un[ord[k%n]]++;for(let k=0;d<0;k++){const j=ord[k%n];if(un[j]>1){un[j]--;d++}}
  t.pk.forEach((s,k)=>out.push({sid:s.id,p:un[k]/100}))});
 return out.sort((x,y)=>SK[IX[x.sid]].price-SK[IX[y.sid]].price)}

function sha256(ascii){function rr(v,a){return(v>>>a)|(v<<(32-a))}var mw=Math.pow(2,32),result='',words=[],bl=ascii.length*8,i,j;var hash=[],k=[],pc=0,comp={};
for(var c=2;pc<64;c++){if(!comp[c]){for(i=0;i<313;i+=c)comp[i]=c;hash[pc]=(Math.pow(c,.5)*mw)|0;k[pc++]=(Math.pow(c,1/3)*mw)|0}}
ascii+='\x80';while(ascii.length%64-56)ascii+='\x00';
for(i=0;i<ascii.length;i++){j=ascii.charCodeAt(i);words[i>>2]|=j<<((3-i)%4)*8}
words[words.length]=(bl/mw)|0;words[words.length]=bl;
for(j=0;j<words.length;){var w=words.slice(j,j+=16),old=hash;hash=hash.slice(0,8);
for(i=0;i<64;i++){var w15=w[i-15],w2=w[i-2],a=hash[0],e=hash[4];
var t1=hash[7]+(rr(e,6)^rr(e,11)^rr(e,25))+((e&hash[5])^(~e&hash[6]))+k[i]+(w[i]=i<16?w[i]:(w[i-16]+(rr(w15,7)^rr(w15,18)^(w15>>>3))+w[i-7]+(rr(w2,17)^rr(w2,19)^(w2>>>10)))|0);
var t2=(rr(a,2)^rr(a,13)^rr(a,22))+((a&hash[1])^(a&hash[2])^(hash[1]&hash[2]));
hash=[(t1+t2)|0].concat(hash);hash[4]=(hash[4]+t1)|0}
for(i=0;i<8;i++)hash[i]=(hash[i]+old[i])|0}
for(i=0;i<8;i++)for(j=3;j+1;j--){var b=(hash[i]>>(j*8))&255;result+=(b<16?'0':'')+b.toString(16)}return result}
function shrink(file){return new Promise((ok,no)=>{const u=URL.createObjectURL(file),im=new Image();im.onload=()=>{const k=Math.min(1,320/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);c.getContext('2d').drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(u);ok(c.toDataURL('image/webp',.85))};im.onerror=no;im.src=u})}

/* взносы в копейках: 50 / 100 / 500 / 1 000 / 5 000 / 10 000 / 50 000 / 100 000 ₽ */
const VT_FEES=[5000,10000,50000,100000,500000,1000000,5000000,10000000];
/* Состав хранилища: ровно 9 ячеек = 5 «не окуп» (30–90% взноса) + 4 «окуп» (140–240% взноса) */
const VT_LOW={n:5,from:30,to:90},VT_HIGH={n:4,from:140,to:240};
const VS={fee:100000,stage:''};
const vLock=`<svg viewBox="0 0 24 24" fill="none" stroke="#c9ced8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="11" width="14" height="9" rx="2" fill="#2c2f37"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/><circle cx="12" cy="15.5" r="1.2" fill="#e82e3b" stroke="none"/></svg>`;
function vOf(p){let v=p.vault;if(!v||typeof v!=='object')v=p.vault={round:null,played:0,spent:0,won:0};return v}
function vValid(r){return !!r&&Number.isInteger(r.fee)&&Array.isArray(r.cells)&&r.cells.length===9&&r.cells.every(c=>c&&SK[IX[c.sid]]&&typeof c.m==='number')&&(r.picked===null||(Number.isInteger(r.picked)&&r.picked>=0&&r.picked<9))}
/* skins whose price is within [fee*from%, fee*to%] — только реальные скины каталога SK */
const vPool=(fee,b)=>SK.filter(s=>s.up&&s.price*100>=fee*b.from&&s.price*100<=fee*b.to);
/* n разных скинов из пула без повторов (частичный Фишер–Йейтс); если пул мал — добор с повторами, если пуст — ближайшие по цене реальные скины */
function vSample(pool,n,fee,b){const a=pool.slice(),out=[];for(let k=0;k<n&&a.length;k++){const j=k+rnd(a.length-k);[a[k],a[j]]=[a[j],a[k]];out.push(a[k])}
if(out.length<n){const src=pool.length?pool:(()=>{const tg=fee*(b.from+b.to)/200;return SK.filter(s=>s.up).sort((x,y)=>Math.abs(x.price-tg)-Math.abs(y.price-tg)).slice(0,12)})();while(out.length<n)out.push(src[rnd(src.length)])}
return out}
/* 9 ячеек: ровно 5 неокупных + 4 окупных, порядок случайный (Фишер–Йейтс) */
function vBuild(fee){const cells=[...vSample(vPool(fee,VT_LOW),VT_LOW.n,fee,VT_LOW),...vSample(vPool(fee,VT_HIGH),VT_HIGH.n,fee,VT_HIGH)].map(s=>({sid:s.id,m:Math.round(s.price/fee*100)/100}));
for(let i=cells.length-1;i>0;i--){const j=rnd(i+1);[cells[i],cells[j]]=[cells[j],cells[i]]}return cells}
function pVault(){const p=G.P(),v=vOf(p);if(v.round&&!vValid(v.round))v.round=null;const r=v.round,active=!!r&&r.picked===null,done=!!r&&r.picked!==null;
if(!VT_FEES.includes(VS.fee))VS.fee=100000;const stage=done&&VS.stage==='one'?'one':'all',fee=(active||(done&&stage==='one'))?r.fee:VS.fee;
const cell=i=>{if(r&&done&&(i===r.picked||stage==='all')){const c=r.cells[i],s=SK[IX[c.sid]];return `<div class="v-cell open ${i===r.picked?'win':'dim'}" id="vc${i}" style="--c:${col(s)};--dl:${i===r.picked?0:(stage==='all'&&VS.fresh?i*60:0)}ms">${upMini(s)}<div class="nm">${esc(s.name)}</div><b>${fmt(s.price)}</b><small>×${c.m}</small></div>`}

 async function getFx(){for(const u of FX_URLS){try{const j=await fetchJson(u);const n=Number(j&&j.rates&&j.rates.RUB);if(n>0&&Number.isFinite(n))return n}catch(e){}}return null}

 function consumeBatch(j,requested,out){

     while(cursor<names.length){const name=names[cursor++];
       try{const v=await fetchSingle(name);out[name]=v;out[norm(name)]=v;progress.found++}

   busyMarket=true;progress={done:0,total:0,found:0};
   const btn=el('gb-admin-market-refresh');if(btn)btn.disabled=true;
   activePromise=(async()=>{
    try{
     const names=[...new Set(SK.map(marketName).filter(Boolean))];
     if(!names.length)throw new Error('В каталоге игры нет предметов с указанным износом');
     progress.total=names.length;
     emit('Проверка OpenSkin: '+names.length+' предметов…',false);
     const fxPromise=getFx(),fresh={};let batchError=null;
     // Публичный бесплатный API v1: пакет POST до 500 market_hash_name за запрос.
     for(let i=0;i<names.length;i+=BATCH_SIZE){
       const batch=names.slice(i,i+BATCH_SIZE);
       try{
         const j=await fetchJson(API+'/prices/batch',{method:'POST',headers:{'Content-Type':'application/json',Accept:'application/json'},body:JSON.stringify({items:batch})});
         consumeBatch(j,batch,fresh);
       }catch(e){batchError=e;console.warn('[OpenSkin] batch POST не прошёл:',e.message)}

       emit('Пакет OpenSkin: '+progress.done+'/'+names.length+' · цены '+progress.found,false);
     }

     if(missing.length){
       progress.done=0;progress.total=missing.length;progress.found=0;
       emit('Уточняем '+missing.length+' позиций через GET API / CORS-резерв…',false);
       fallbackFailures=await fetchFallback(missing,fresh);
       if(fallbackFailures.length)console.warn('[OpenSkin] не найдены отдельные цены:',fallbackFailures);
     }

     const foundNames=names.filter(n=>fresh[n]||fresh[norm(n)]);
     if(!foundNames.length){
       let probe='';try{const test=await fetchSingle('AK-47 | Redline (Field-Tested)');probe=' Контрольный запрос OpenSkin работает ('+test.usd+' USD), но названия предметов каталога GemBull не совпали.'}catch(pe){probe=' Контрольный запрос тоже не прошёл: '+String(pe.message||pe).slice(0,150)+'.'}
       const detail=batchError?' Пакетный запрос: '+batchError.message+'.':' API ответил, но не вернул цены для этих названий.';
       const fb=fallbackFailures.length?' GET-резерв: '+fallbackFailures[0]+'.':'';
       throw new Error('0 из '+names.length+' предметов получили цену.'+detail+fb+probe);
     }
     // Сохраняем старые цены для предметов, которые OpenSkin временно не вернул.
     marketCache={...marketCache,...fresh};cacheSave();
     const count=applyPrices();
     const saved=names.length-foundNames.length;
     const msg='OpenSkin обновлён: '+foundNames.length+'/'+names.length+' предметов'+(saved?' · без новой цены: '+saved:'')+(fxRate?' · цены пересчитаны в RUB':' · показ USD, курс RUB недоступен');
     emit(msg,true);gbSafeRender();

    }catch(e){

     if(count)gbSafeRender();return false;
    }finally{
     busyMarket=false;activePromise=null;if(btn)btn.disabled=false;
    }
   })();
   return activePromise;
 }

/* ===== TRADE-UP CONTRACTS (раздел UPGRADE → вкладка 2). Данные профиля: p.tc = {h:[история], st:{статистика}, seq} ===== */
window.TC=(function(){
const B=BigInt,MINN=5,MAXN=10,PL=[23n,83n],PW=[117n,267n],P_WIN=35,HMAX=300,MODEK='sus_upmode';

const MS=B(Number.MAX_SAFE_INTEGER),num=x=>x>MS?Number.MAX_SAFE_INTEGER:Number(x);
function lb(x){const a=sks();let l=0,h=a.length;while(l<h){const m=(l+h)>>1;if(a[m].price<x)l=m+1;else h=m}return l}

function rngOf(total){total=B(total);const up=a=>(total*a+99n)/100n,dn=a=>total*a/100n;return{lose:[up(PL[0]),dn(PL[1])],win:[up(PW[0]),dn(PW[1])]}}
function rndBig(n){if(n<=1n)return 0n;const bits=n.toString(2).length,bytes=Math.ceil(bits/8),mask=(1n<<B(bits))-1n;for(;;){const a=new Uint8Array(bytes);crypto.getRandomValues(a);let x=0n;for(const b of a)x=(x<<8n)|B(b);x&=mask;if(x<n)return x}}

/* выбор результата: 65% НЕ ОКУП / 35% ОКУП (внутренний баланс, в интерфейсе не показывается), затем стоимость v внутри диапазона, затем реальный скин из SK внутри диапазона */

for(let k=0;k<14&&!pool.length;k++){const x=v-tol<lo?lo:v-tol,y=v+tol>hi?hi:v+tol,[j0,j1]=span(x,y);for(let j=j0;j<j1;j++)if(!ex||!ex.has(a[j].id))pool.push(a[j]);tol*=2n}

/* пул карточек для ленты рулетки: только скины в диапазоне возможных результатов этой ставки (от нижней границы неокупа до верхней границы окупа) */

const price=i=>SK[IX[i.sid]].price,sum=items=>items.reduce((a,i)=>a+B(price(i)),0n);

 ecreset(){if(!adm())return;const c=S.cases.find(x=>x.id===ES.id);if(!c)return;if(!confirm('Вернуть рекомендованные настройки кейса и пересобрать состав? Текущий состав будет заменён (резервная копия создаётся).'))return;backup('Сброс кейса «'+c.name+'»');if(c.ec){delete c.ec.prof;c.ec.manual=false}const b=rebuildCase(c,poolConfirmed());L('Сброс настроек кейса',{v:c.name});save();ED=null;ES.msg=b.ok?['Рекомендованные настройки применены',false]:[b.err,true];redo()},
 ecrecalc(){if(!adm())return;const c=S.cases.find(x=>x.id===ES.id);if(!c)return;backup('Пересчёт кейса «'+c.name+'»');if(c.ec)c.ec.manual=false;const b=rebuildCase(c,poolConfirmed(),ED&&ED.prof?ED.prof:null);if(b.ok&&ED&&ED.prof){c.ec=c.ec||{};c.ec.prof=ED.prof}save();ED=null;ES.msg=b.ok?['Состав пересчитан и сохранён',false]:[b.err,true];redo()},
 esave(){if(!adm()||!ED)return;const c=S.cases.find(x=>x.id===ES.id);if(!c)return;const v=CORE.validate(ED.items,c.price,infoCb);if(v.err.length){ES.msg=[v.err[0],true];return redo()}
  backup('Правка кейса «'+c.name+'»');c.items=ED.items.map(i=>({sid:i.sid,p:i.p}));c.ec=Object.assign(c.ec||{},{st:'built',manual:!!ED.manual,w:[],t:Date.now()});if(ED.prof)c.ec.prof=ED.prof;L('Изменён состав кейса',{v:c.name});save();ED=null;ES.msg=['Состав сохранён',false];redo()},
 oskref(){if(!adm())return;const b=el('osk-btn'),s=el('osk-st');if(b)b.disabled=true;if(s)s.textContent='Запускаю обновление…';Promise.resolve(window.GemBullOpenSkin.refresh()).finally(()=>{aliasPass();syncPrices(false);try{save()}catch(x){}if(V.p==='admin'&&AT==='osk')render()})}
};
function readProf(c){const root=el('eprof'),base=profFor(c);if(!root)return base;const t=[...root.querySelectorAll('[data-tier]')].map(x=>Math.round(rd(x.value,0)*100)),g=rd(root.querySelector('[data-gamma]').value,base.gamma);return{tiers:t.length===5?t:base.tiers,counts:base.counts,gamma:g}}
document.addEventListener('click',e=>{const t=e.target.closest&&e.target.closest('[data-ea]');if(!t||t.disabled)return;const f=EA[t.dataset.ea];if(f)f(t.dataset,t,e)});
document.addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&e.target.classList&&e.target.classList.contains('gk')){e.preventDefault();e.target.click()}});
const onIn=e=>{const t=e.target,k=t.dataset&&t.dataset.ei;if(!k)return;
 if(k==='cq'){EF.q=t.value;const g=el('gkg');if(g)g.innerHTML=casesGrid()}
 else if(k==='cpr'||k==='ccol'||k==='csort'){if(e.type!=='change')return;if(k==='cpr')EF.pr=t.value;else if(k==='ccol')EF.col=t.value;else EF.sort=t.value;const g=el('gkg');if(g)g.innerHTML=casesGrid()}
 else if(k==='invq'){IF.q=t.value;const g=el('gkig');if(g)g.innerHTML=invGrid()}
 else if(k==='inv'){if(e.type!=='change')return;IF[t.dataset.f]=t.value;const g=el('gkig');if(g)g.innerHTML=invGrid()}
 else if(!isAdm())return;
 else if(k==='eq'){if(e.type!=='change')return;ES.q=t.value;redo()}else if(k==='epr'){if(e.type!=='change')return;ES.pr=t.value;redo()}else if(k==='ecol'){if(e.type!=='change')return;ES.col=t.value;redo()}
 else if(k==='eip'){if(e.type!=='change'||!ED)return;const n=Math.round(rd(t.value,NaN)*100)/100;ED.items[+t.dataset.k].p=n;ED.manual=true;redo()}
 else if(k==='eprice'){if(e.type!=='change')return;const c=S.cases.find(x=>x.id===ES.id),n=Math.round(rd(t.value,NaN)*100);if(!c||!Number.isSafeInteger(n)||n<1){toast('Неверная цена','err');return redo()}
  backup('Цена кейса «'+c.name+'»: '+fmt(c.price)+' → '+fmt(n));c.price=n;try{c.cat=window.gbTier?window.gbTier(n):c.cat}catch(x){}if(c.ec)c.ec.manual=false;const b=rebuildCase(c,poolConfirmed());L('Цена кейса',{v:c.name+' → '+n});save();ED=null;ES.msg=b.ok?['Цена обновлена, состав пересчитан под новый диапазон',false]:['Цена обновлена, но состав не собран: '+b.err,true];redo()}
 else if(k==='eon'){if(e.type!=='change')return;const c=S.cases.find(x=>x.id===ES.id);if(c){c.en=t.checked;save();toast(c.en?'Кейс включён':'Кейс отключён')}}};
document.addEventListener('input',onIn);document.addEventListener('change',onIn);
/* ---------- подключение к рендеру и админке ---------- */
const _render=render;render=function(){try{document.body.dataset.pg=V.p;document.body.classList.toggle('gbx',V.p!=='upgrade')}catch(e){}return _render.apply(this,arguments)};
pCases=pCasesN;pCase=pCaseN;pInv=pInvN;
const _pAdmin=pAdmin;pAdmin=function(){if(!isAdm())return _pAdmin();
 let h=_pAdmin();h=h.replace('<button data-a="logout">',`<button data-a="at" data-id="econ" class="${AT=='econ'?'on':''}">Экономика</button><button data-a="at" data-id="osk" class="${AT=='osk'?'on':''}">Цены OpenSkin</button><button data-a="logout">`);
 if(AT==='econ')h+=pEcon();else if(AT==='osk')h+=pOsk();return h};
/* ---------- запуск ---------- */
wrapOpen('open');wrapOpen('openFast');['sell','sellDrop','sellAllGo'].forEach(wrapSell);wrapCaseEdit();
try{aliasPass();syncPrices(false);E();save()}catch(e){console.error('[GBE] init',e)}
try{document.body.dataset.pg=V.p;document.body.classList.toggle('gbx',V.p!=='upgrade');render()}catch(e){console.error('[GBE] first render',e)}
window.GBE={core:CORE,pinfo,rebuildAll,rebuildCase,cstats,caseStatus,backup,priceCounts,poolConfirmed,E};
})();

</script>
